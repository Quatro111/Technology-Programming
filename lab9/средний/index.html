<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поиск публикаций</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Поиск публикаций</h1>

    <button id="load">Загрузить публикации</button>

    <input
      id="search"
      type="search"
      placeholder="Введите слово из заголовка"
      aria-label="Поиск по заголовку"
      disabled
    >

    <p id="status" role="status">Загрузите публикации.</p>
    <ul id="results"></ul>
  </main>
</body>
</html>
