<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>JWT Authentication</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>JWT Authentication</h1>
    <p>Демонстрация авторизации с помощью JWT</p>

    <form id="loginForm">
        <input id="login" placeholder="Логин" required>
        <input id="password" type="password"
               placeholder="Пароль" required>

        <button type="submit">Получить JWT</button>
    </form>

    <h3>Полученный токен:</h3>
    <textarea id="token" readonly></textarea>

    <button id="checkButton">Проверить токен</button>

    <p id="message"></p>
</div>

<script src="script.js"></script>
</body>
</html>
