<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список задач</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            min-height: 100vh;
            padding: 40px;
        }

        .todo {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        #taskInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        #addButton {
            background-color: #2ecc71;
            color: white;
        }

        .filters {
            margin: 20px 0;
            text-align: center;
        }

        .filterButton {
            background-color: #dfe6e9;
        }

        .filterButton.active {
            background-color: #0984e3;
            color: white;
        }

        ul {
            padding: 0;
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 0;
            padding: 12px;
            background-color: #f1f2f6;
            border-radius: 7px;
        }

        .task-text {
            flex: 1;
            margin-left: 10px;
        }

        .completed {
            text-decoration: line-through;
            color: #888;
        }

        .delete {
            background-color: #e74c3c;
            color: white;
        }

        .statistics {
            margin-top: 20px;
            padding: 15px;
            background-color: #ecf0f1;
            border-radius: 8px;
            text-align: center;
        }

        #emptyMessage {
            text-align: center;
            color: #888;
        }
    </style>
</head>

<body>

<div class="todo">

    <h1>📝 Мои задачи</h1>

    <div class="input-area">
        <input
            id="taskInput"
            type="text"
            placeholder="Введите новую задачу"
        >

        <button id="addButton">Добавить</button>
    </div>

    <div class="filters">
        <button class="filterButton active" data-filter="all">
            Все
        </button>

        <button class="filterButton" data-filter="active">
            Невыполненные
        </button>

        <button class="filterButton" data-filter="completed">
            Выполненные
        </button>
    </div>

    <ul id="taskList"></ul>

    <p id="emptyMessage">Задач пока нет</p>

    <div class="statistics">
        <p>Всего задач: <span id="total">0</span></p>
        <p>Выполнено: <span id="completed">0</span></p>
        <p>Осталось: <span id="active">0</span></p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
