<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FAQ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Часто задаваемые вопросы</h1>

    <div class="faq">
        <button class="question">Что такое JavaScript?</button>
        <div class="answer">
            JavaScript-язык программирования для создания интерактивных веб-страниц.
        </div>

        <button class="question">Что такое DOM?</button>
        <div class="answer">
            DOM-объектная модель HTML-документа.
        </div>

        <button class="question">Что такое событие?</button>
        <div class="answer">
            Событие-действие пользователя, например клик мышью.
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
